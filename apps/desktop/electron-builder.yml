appId: dev.openharness.desktop
productName: Open Harness
asar: true
afterSign: ./scripts/verify-signature.mjs
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/plugins
    to: plugins
  - from: node_modules/playwright-core
    to: browser-runtime
mac:
  forceCodeSigning: true
  category: public.app-category.developer-tools
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
  category: Development
