name: Checks

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Check documentation
        run: cargo test --workspace --doc --locked

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      package_windows: ${{ steps.package-version.outputs.changed }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: apps/desktop/.pnpm-store
          key: ${{ runner.os }}-desktop-pnpm-${{ hashFiles('apps/desktop/pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-desktop-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Check desktop version change
        id: package-version
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/ci-package-version.mjs
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  desktop-e2e:
    name: Desktop workflow regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/.pnpm-store
          key: ubuntu-desktop-e2e-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/desktop/pnpm-lock.yaml') }}
          restore-keys: ubuntu-desktop-e2e-
      - run: pnpm install --frozen-lockfile
      - name: Install Electron display dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build local runtime
        run: node scripts/backend.mjs debug
      - name: Build Electron application
        run: pnpm run build
      - name: Check regression process cleanup
        run: node --test tests/e2e/process-cleanup-check.mjs
      - name: Check desktop workflows with local fixture models
        run: xvfb-run -a pnpm run test:e2e:regression
      - name: Upload desktop regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-workflow-regressions
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: apps/desktop/.pnpm-store
          key: ${{ runner.os }}-desktop-pnpm-${{ hashFiles('apps/desktop/pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-desktop-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - run: pnpm run test:chrome
      - run: pnpm run test:computer

  windows-node:
    name: Windows sandbox-compatible Node
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare NASM for the official Node build
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nasm.zip'
          Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6') {
            throw 'NASM archive SHA-256 mismatch'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP -Force
          (Join-Path $env:RUNNER_TEMP 'nasm-2.16.03') >> $env:GITHUB_PATH
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/openharness-node-cache
          key: windows-2022-x64-node-${{ hashFiles('apps/desktop/scripts/workspace-runtime-node-windows.mjs', 'apps/desktop/scripts/workspace-runtime/patches/*.patch') }}
      - name: Build pinned Node with upstream AppContainer pipe fix
        run: node apps/desktop/scripts/build-windows-node.mjs "${{ runner.temp }}/openharness-node-cache" "${{ runner.temp }}/openharness-node-runtime"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-node-runtime
          path: ${{ runner.temp }}/openharness-node-runtime/
          if-no-files-found: error
          retention-days: 7

  windows-checks:
    name: Windows checks
    needs: [windows-node]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      OPENHARNESS_WINDOWS_SANDBOX_HELPER: ${{ github.workspace }}\target\debug\openharness-sandbox.exe
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: windows-node-runtime
          path: ${{ runner.temp }}/openharness-node-runtime
      - name: Select verified Node for sandbox checks
        run: |
          "OPENHARNESS_TEST_NODE=$env:RUNNER_TEMP\openharness-node-runtime\node.exe" >> $env:GITHUB_ENV
          "OPENHARNESS_NODE_RUNTIME_DIR=$env:RUNNER_TEMP\openharness-node-runtime" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: apps/desktop/.pnpm-store
          key: ${{ runner.os }}-desktop-pnpm-${{ hashFiles('apps/desktop/pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-desktop-pnpm-
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x64-checks-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-x64-checks-rust-
      - run: pnpm install --frozen-lockfile
      - name: Build Windows command sandbox helper
        id: sandbox-helper
        run: cargo build -p agent-local --bin openharness-sandbox --locked
      - name: Prepare Windows script environment
        run: |
          & $env:OPENHARNESS_WINDOWS_SANDBOX_HELPER --prepare-metadata
          if ($LASTEXITCODE -ne 0) { throw 'Windows script environment preparation failed' }
          $status = & $env:OPENHARNESS_WINDOWS_SANDBOX_HELPER --metadata-status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $status.ready) { throw 'Windows script environment is not ready' }
      - name: Check Node child-process pipes inside AppContainer
        run: cargo test -p agent-local --test windows_sandbox node_child_process_pipes_complete_and_remain_sandboxed --locked -- --nocapture
      - name: Check Windows local command permissions, sandbox, and lifecycle
        run: cargo test -p agent-local --all-targets --locked --no-fail-fast
      - name: Check Windows API execution and runtime shutdown
        if: ${{ !cancelled() && steps.sandbox-helper.outcome == 'success' }}
        run: cargo test -p api --lib --test local_workspace --test parent_lifetime --locked --no-fail-fast
      - name: Check Windows launcher lifecycle
        if: ${{ !cancelled() && steps.sandbox-helper.outcome == 'success' }}
        run: cargo test -p chrome-native-host --all-targets --locked
      - name: Check Windows desktop runtime and paths
        if: ${{ !cancelled() && steps.sandbox-helper.outcome == 'success' }}
        run: >-
          pnpm exec vitest run
          scripts/workspace-runtime-node.test.mjs
          scripts/workspace-runtime-node-windows.test.mjs
          scripts/workspace-runtime-bundle.test.mjs
          scripts/workspace-runtime.test.mjs
          src/main/workspace-runtime.test.ts
          src/main/run-workspace.test.ts
          src/main/run-workspace.windows.test.ts
          src/main/chrome-connection.windows.test.ts
          src/main/chrome-windows.test.ts
          src/main/computer-preview.test.ts
          src/main/windows-script-environment.test.ts
      - name: Check Windows Chrome transport
        if: ${{ !cancelled() && steps.sandbox-helper.outcome == 'success' }}
        run: node --test ../../plugins/chrome-use/tests/bridge.test.mjs ../../plugins/chrome-use/tests/launch.test.mjs ../../plugins/chrome-use/tests/controller.test.mjs

      - name: Build and check Windows computer helper
        run: node ../../plugins/computer-use/windows/build.mjs
      - name: Check Windows visual target validation
        run: node --test ../../plugins/computer-use/tests/visual-guard.test.mjs
      - name: Check Windows live preview and cursor lifecycle
        run: node --test ../../plugins/computer-use/tests/feedback.test.mjs

      - name: Install Electron for permission workflow checks
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
        run: node node_modules/electron/install.js
      - name: Build debug backend for permission workflow checks
        run: node scripts/backend.mjs debug
      - name: Build desktop for permission workflow checks
        run: pnpm build
      - name: Check Windows permission workflow in Electron
        timeout-minutes: 10
        run: pnpm test:e2e:permissions
      - name: Check Windows in-app computer preview
        timeout-minutes: 5
        run: node tests/e2e/computer-preview.mjs
      - name: Upload Windows permission workflow evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-permissions-e2e
          path: apps/desktop/test-results/permissions/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows x64 installer
    needs: [check, desktop, desktop-e2e, plugins, windows-checks]
    if: needs.desktop.outputs.package_windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: windows-node-runtime
          path: ${{ runner.temp }}/openharness-node-runtime
      - name: Select verified Node for packaging
        run: '"OPENHARNESS_NODE_RUNTIME_DIR=$env:RUNNER_TEMP\openharness-node-runtime" >> $env:GITHUB_ENV'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: apps/desktop/.pnpm-store
          key: ${{ runner.os }}-desktop-pnpm-${{ hashFiles('apps/desktop/pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-desktop-pnpm-
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x64-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/desktop/scripts/backend.mjs') }}
          restore-keys: windows-x64-rust-
      - run: pnpm install --frozen-lockfile
      - name: Prepare Chrome for Testing
        run: pnpm exec playwright install chromium
      - name: Build Windows installer
        run: pnpm run package:win
      - name: Save compiled backend cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Install, launch, and uninstall the packaged app
        run: ./scripts/test-windows-installer.ps1
      - name: Record checksums and build provenance
        run: |
          $installers = @(Get-ChildItem release/Open-Harness-*-windows-x64-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Get-FileHash $installers[0].FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content release/SHA256SUMS.txt -Encoding utf8
          @{
            commit = $env:GITHUB_SHA
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            version = (Get-Content package.json | ConvertFrom-Json).version
            platform = 'windows-x64'
            signed = $false
          } | ConvertTo-Json | Set-Content release/build-info.json -Encoding utf8
      - name: Upload Windows installer
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: Open-Harness-windows-x64-${{ github.run_number }}
          path: |
            apps/desktop/release/Open-Harness-*-windows-x64-setup.exe
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Link installer in run summary
        env:
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
        run: |
          "Windows x64 installer: [$env:ARTIFACT_URL]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          'Unsigned test build. Installed-app offline task and restart checks passed. Artifact expires after 14 days.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-smoke-diagnostics-${{ github.run_number }}
          path: apps/desktop/test-results/packaged/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: Open-Harness-windows-x64-${{ github.run_number }}
          path: release-assets
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/publish-github-release.mjs release-assets
