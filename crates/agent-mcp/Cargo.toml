[package]
name = "agent-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
futures = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client"] }
serde.workspace = true
serde_json.workspace = true
sse-stream = "0.2.4"
thiserror = "2"
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
