[package]
name = "agent-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
agent-core = { version = "0.1.0", path = "../agent-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
