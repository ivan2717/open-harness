[package]
name = "agent-local"
version.workspace = true
edition.workspace = true

[dependencies]
agent-runtime = { path = "../agent-runtime" }
calamine = "0.37.0"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
flate2 = "1.1"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "macros", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
