[workspace]
resolver = "3"
members = [
    "api",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agent-adapters = { version = "0.1.0", path = "crates/agent-adapters" }
agent-core = { version = "0.1.0", path = "crates/agent-core" }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

